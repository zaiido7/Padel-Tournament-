<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMASH & BREATH - Tournament</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
body { font-family:'Segoe UI', Tahoma, Geneva, Verdana,sans-serif; margin:0; padding:0; background:#0b1e3a; color:#fff;}
.hidden {display:none !important;} /* Added !important to ensure hiding works robustly */
header {padding:10px; background-color: rgba(0,0,0,0.5);}
header h1 {margin:0;font-size:2rem;text-align:center; color:#ffd700; letter-spacing:2px;}
header h2 {margin:0;font-size:1.5rem;text-align:center; color:#ffd700;}
.nav-container {display:flex; justify-content:space-between; align-items:flex-start; padding:10px; background:rgba(0,0,0,0.3);}
.nav-left, .nav-right {display:flex; flex-direction:column; gap:5px;}
.nav-left a, .nav-right a, .nav-left select, .nav-left button {padding:5px 10px; border-radius:5px; border:none; font-size:0.85rem; cursor:pointer; text-decoration:none; color:#000; background:#ffd700; text-align:center;}
.nav-right a {margin-bottom:5px;}
button {padding:15px 30px; margin:10px; font-size:1.2rem; border:none; border-radius:8px; cursor:pointer; background:#ffd700; color:#000;}
button:hover {background:#ffc107;}

/* New style for the reset button */
.danger-btn {background-color: #ff4444 !important; color: #fff !important; margin-top: 10px; padding: 5px 10px !important; font-size: 0.85rem !important; font-weight: bold;}
.danger-btn:hover {background-color: #cc0000 !important;}

.container {display:flex; flex-wrap:wrap; justify-content:center; gap:20px; padding:20px;}
.group, .knockout {background:rgba(255,255,255,0.05); border-radius:10px; padding:20px; min-width:350px; flex:1 1 350px;}
.group h2, .knockout h2 {text-align:center;margin-bottom:10px; color:#ffd700;}
.team {margin-bottom:20px; background:rgba(0,0,0,0.2); border-radius:8px; padding:10px;}
.team h3 {margin:5px 0;}
.matches {display:flex; flex-wrap:nowrap; gap:10px; overflow-x:auto;}
.match {background:rgba(255,255,255,0.05); padding:5px; border-radius:5px; min-width:140px; flex:0 0 auto;}
.match label {display:block; font-size:0.8rem; margin-bottom:4px;}
input {width:50px; text-align:center; margin-top:2px;}
.standings {margin-top:20px; text-align:center;}
.standings h2 {color:#00ffea;}
.knockout-match {margin-bottom:10px; padding:10px; background:rgba(0,0,0,0.3); border-radius:8px; border-left: 4px solid #ffd700;}
.knockout-match p {margin: 5px 0;}
.knockout h3 {margin:5px 0;}
.champion {text-align:center; margin-top:20px; font-size:1.5rem; color:#ffdd00;}
.winner {background-color: rgba(0,255,0,0.3);}
.loser {background-color: rgba(255,0,0,0.3);}
.disabled input {background:#ccc;color:#666; cursor:not-allowed;}
select.winner-select { padding: 5px; border-radius: 4px; background: #222; color: #fff; border: 1px solid #ffd700; margin-left: 10px; font-family: inherit; font-size: 0.9rem;}
</style>
</head>
<body>

<div id="welcomeScreen" style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; text-align:center;">
  <h1 style="font-size:3rem; color:#ffd700; margin-bottom:10px;">Welcome to SMASH & BREATH</h1>
  <h2 style="font-size:2rem; color:#ffd700; margin-bottom:40px;">YU LC</h2>
  <button id="participantsBtn">Participants</button>
  <button id="adminBtn">Admins</button>
</div>

<div id="tournamentScreen" class="hidden">
<header>
<h1>SMASH & BREATH</h1>
<h2>YU LC</h2>
<div class="nav-container">
  <div class="nav-left" id="teamsNav"></div>
  <div class="nav-right">
    <a href="#QuarterFinals">Quarter-Finals</a>
    <a href="#SemiFinals">Semi-Finals</a>
    <a href="#Final">Final</a>
    <a href="#Champion">Champion</a>
    <button id="resetBtn" class="danger-btn hidden">⚠️ Reset Tournament</button>
  </div>
</div>
</header>

<div class="container">
<div class="group" id="groupA"><h2>Group A</h2></div>
<div class="group" id="groupB"><h2>Group B</h2></div>
</div>

<div class="standings"><h2>Standings</h2><div id="standings"></div></div>

<div class="knockout">
<h2 id="QuarterFinals">Quarter-Finals</h2><div id="knockouts"></div>
<h2 id="SemiFinals">Semi-Finals</h2><div id="semi-finals"></div>
<h2 id="Final">Final</h2><div id="final"></div>
<div class="champion" id="Champion"><strong>Champion: <span id="championName" style="color: #fff;">TBD</span></strong></div>
</div>
</div>

<script> 
const firebaseConfig = {
  apiKey: "AIzaSyCWd9QFGDPI9Mq1TOgOdj_8DQz2eVdzR9g",
  authDomain: "padel-tournament-yu.firebaseapp.com",
  databaseURL: "https://padel-tournament-yu-default-rtdb.asia-southeast1.firebasedatabase.app", 
  projectId: "padel-tournament-yu",
  storageBucket: "padel-tournament-yu.firebasestorage.app",
  messagingSenderId: "1095340767461",
  appId: "1:1095340767461:web:9db10e0fe80a2b40473c0c"
};

let database;
firebase.initializeApp(firebaseConfig);
database = firebase.database();

// Variables
let isAdmin=false, isParticipant=false;
let tournamentStarted=false;
const matchCount=7;

let manualWinners = { QF: ['','','',''], SF: ['',''], Final: [''] };

const teamsA=[
"خالد البدو و كريم شقير","احمد بني عوده و رافع خريسات","كنان الشطناوي و عمر خصاونة","احمد حموري و رضا شادي",
"جعفر السريحين و عبدالله بطاينة","محمد يوسف و ذوالفقار","ايهم خصاونة و يوسف الشباب","ورد و حلا غرايبة"
];
const teamsB=[
"سيف صبابحة و زيد العجلوني","عون البلص و عامر العمري","مؤمن نجم و نمر العريق","زيد جرادات و يزن موسى",
"محمد بني هاني و عبد الرحمن ابو ملوح","ايثار الشطناوي و حسن حداد","المندّر مدحت و عبد الرحمن ابو لاوي","عامر عياش و علاء المشرقي"
];

let knockoutData = { QF: [], SF: [], Final: [], Champion: '' };

// Welcome buttons
document.getElementById('participantsBtn').addEventListener('click',()=>{
  if(!tournamentStarted){
    isParticipant=true; isAdmin=false;
    document.getElementById('welcomeScreen').classList.add('hidden');
    document.getElementById('tournamentScreen').classList.remove('hidden');
    startTournament();
    tournamentStarted=true;
  }
});

document.getElementById('adminBtn').addEventListener('click',()=>{
  if(!tournamentStarted){
    const code=prompt("Enter Admin Code:");
    if(code==='2537'){
      isAdmin=true; isParticipant=false;
      document.getElementById('welcomeScreen').classList.add('hidden');
      document.getElementById('tournamentScreen').classList.remove('hidden');
      
      // Reveal the Reset button ONLY to the Admin
      document.getElementById('resetBtn').classList.remove('hidden');
      
      startTournament();
      tournamentStarted=true;
    } else alert("Incorrect code!");
  }
});

// Reset Button Logic
document.getElementById('resetBtn').addEventListener('click', () => {
  // 1. Ask for confirmation
  const isSure = confirm("⚠️ WARNING: Are you sure you want to RESET the entire tournament? All scores and knockout winners will be erased for everyone. This cannot be undone.");
  
  if(isSure) {
    // 2. Wipe all inputs back to 0
    document.querySelectorAll('.setsForInput, .setsAgainstInput').forEach(inp => {
      inp.value = 0;
    });
    
    // 3. Wipe the manual winners memory
    manualWinners = { QF: ['','','',''], SF: ['',''], Final: [''] };
    
    // 4. Update the UI locally
    updateStandings();
    updateKnockoutsFull();
    
    // 5. Send the blank slate to Firebase so all participants see the reset
    if(database && isAdmin) saveToFirebase();
    
    alert("Tournament has been completely reset.");
  }
});

// Populate Teams Nav
function populateTeamsNav(){
  const nav=document.getElementById('teamsNav');
  nav.innerHTML='';
  teamsA.forEach((t,i)=>{
    const a=document.createElement('a'); a.href='#teamA'+(i+1); a.textContent=t; nav.appendChild(a);
  });
  teamsB.forEach((t,i)=>{
    const a=document.createElement('a'); a.href='#teamB'+(i+1); a.textContent=t; nav.appendChild(a);
  });
}

// Tournament setup
function startTournament(){
  populateTeamsNav();
  const containerA=document.getElementById('groupA');
  const containerB=document.getElementById('groupB');

  containerA.innerHTML = '<h2>Group A</h2>';
  containerB.innerHTML = '<h2>Group B</h2>';

  function createTeamDiv(container,name,id){
    const div=document.createElement('div'); div.className='team'; div.id=id;
    let matchesHTML='';
    for(let m=1;m<=matchCount;m++){
      matchesHTML+=`<div class="match">
<label>Match ${m} Sets For<input type="number" min="0" value="0" class="setsForInput"></label>
<label>Match ${m} Sets Against<input type="number" min="0" value="0" class="setsAgainstInput"></label>
</div>`;
    }
    div.innerHTML=`<h3>${name}</h3><div class="matches">${matchesHTML}</div>
<p>Played: <span class="played">0</span> | Won: <span class="won">0</span> | Lost: <span class="lost">0</span> | Sets For: <span class="setsFor">0</span> | Sets Against: <span class="setsAgainst">0</span> | Diff: <span class="diff">0</span> | Points: <span class="points">0</span></p>`;
    container.appendChild(div);
  }

  teamsA.forEach((t,i)=>createTeamDiv(containerA,t,'teamA'+(i+1)));
  teamsB.forEach((t,i)=>createTeamDiv(containerB,t,'teamB'+(i+1)));

  if(isParticipant) document.querySelectorAll('input').forEach(inp=>inp.disabled=true);

  attachInputListeners();
  
  if(database) listenToFirebase(); 
  
  updateStandings();
  updateKnockoutsFull();
}

// Standings Calculation
function updateStandings(){
  const allTeams=[...teamsA.map((t,i)=>'teamA'+(i+1)), ...teamsB.map((t,i)=>'teamB'+(i+1))];
  allTeams.forEach(id=>{
    const teamDiv=document.getElementById(id);
    const matches=teamDiv.querySelectorAll('.match');
    let played=0, won=0, lost=0, setsFor=0, setsAgainst=0;
    matches.forEach(match=>{
      const sf=Number(match.querySelector('.setsForInput').value);
      const sa=Number(match.querySelector('.setsAgainstInput').value);
      if(sf>0 || sa>0){played++; setsFor+=sf; setsAgainst+=sa;}
      if(sf>sa) won++; else if(sa>sf) lost++;
    });
    const diff=setsFor-setsAgainst;
    const points=won*3;
    teamDiv.querySelector('.played').textContent=played;
    teamDiv.querySelector('.won').textContent=won;
    teamDiv.querySelector('.lost').textContent=lost;
    teamDiv.querySelector('.setsFor').textContent=setsFor;
    teamDiv.querySelector('.setsAgainst').textContent=setsAgainst;
    teamDiv.querySelector('.diff').textContent=diff;
    teamDiv.querySelector('.points').textContent=points;
  });
}

function updateKnockoutsFull(){
  const sortedA = [...teamsA.map((t,i)=>'teamA'+(i+1))].sort((a,b)=>{
    const pa = Number(document.getElementById(a).querySelector('.points').textContent);
    const pb = Number(document.getElementById(b).querySelector('.points').textContent);
    if(pb!==pa) return pb-pa;
    const da = Number(document.getElementById(a).querySelector('.diff').textContent);
    const db = Number(document.getElementById(b).querySelector('.diff').textContent);
    return db-da;
  });
  const sortedB = [...teamsB.map((t,i)=>'teamB'+(i+1))].sort((a,b)=>{
    const pa = Number(document.getElementById(a).querySelector('.points').textContent);
    const pb = Number(document.getElementById(b).querySelector('.points').textContent);
    if(pb!==pa) return pb-pa;
    const da = Number(document.getElementById(a).querySelector('.diff').textContent);
    const db = Number(document.getElementById(b).querySelector('.diff').textContent);
    return db-da;
  });

  knockoutData.QF = [
    {team1: sortedA[0], team2: sortedB[3], winner: manualWinners.QF[0] || ''},
    {team1: sortedA[1], team2: sortedB[2], winner: manualWinners.QF[1] || ''},
    {team1: sortedB[0], team2: sortedA[3], winner: manualWinners.QF[2] || ''},
    {team1: sortedB[1], team2: sortedA[2], winner: manualWinners.QF[3] || ''}
  ];

  knockoutData.SF = [
    {team1: knockoutData.QF[0].winner || 'TBD', team2: knockoutData.QF[3].winner || 'TBD', winner: manualWinners.SF[0] || ''},
    {team1: knockoutData.QF[2].winner || 'TBD', team2: knockoutData.QF[1].winner || 'TBD', winner: manualWinners.SF[1] || ''}
  ];

  knockoutData.Final = [
    {team1: knockoutData.SF[0].winner || 'TBD', team2: knockoutData.SF[1].winner || 'TBD', winner: manualWinners.Final[0] || ''}
  ];

  knockoutData.Champion = knockoutData.Final[0].winner || 'TBD';

  renderKnockouts();
}

function getTeamName(id) {
  if (!id || id === 'TBD') return 'TBD';
  const el = document.getElementById(id);
  return el ? el.querySelector('h3').textContent : 'TBD';
}

function buildSelect(stage, index, match) {
  if (!isAdmin) {
    return `<span style="color: #00ffea;">${getTeamName(match.winner)}</span>`;
  }

  const t1Name = getTeamName(match.team1);
  const t2Name = getTeamName(match.team2);
  
  let html = `<select class="winner-select" data-stage="${stage}" data-index="${index}">
      <option value="">-- Select Winner --</option>`;
  if(match.team1 && match.team1 !== 'TBD') html += `<option value="${match.team1}" ${match.winner===match.team1?'selected':''}>${t1Name}</option>`;
  if(match.team2 && match.team2 !== 'TBD') html += `<option value="${match.team2}" ${match.winner===match.team2?'selected':''}>${t2Name}</option>`;
  html += `</select>`;
  return html;
}

function renderKnockouts(){
  const QFContainer=document.getElementById('knockouts');
  QFContainer.innerHTML='';
  knockoutData.QF.forEach((match,i)=>{
    const div=document.createElement('div'); div.className='knockout-match';
    div.innerHTML=`<p><strong>QF ${i+1}:</strong> ${getTeamName(match.team1)} vs ${getTeamName(match.team2)}</p>
                   <p>Winner: ${buildSelect('QF', i, match)}</p>`;
    QFContainer.appendChild(div);
  });

  const SFContainer=document.getElementById('semi-finals');
  SFContainer.innerHTML='';
  knockoutData.SF.forEach((match,i)=>{
    const div=document.createElement('div'); div.className='knockout-match';
    div.innerHTML=`<p><strong>SF ${i+1}:</strong> ${getTeamName(match.team1)} vs ${getTeamName(match.team2)}</p>
                   <p>Winner: ${buildSelect('SF', i, match)}</p>`;
    SFContainer.appendChild(div);
  });

  const FContainer=document.getElementById('final');
  FContainer.innerHTML='';
  if(knockoutData.Final.length>0){
    const match=knockoutData.Final[0];
    const div=document.createElement('div'); div.className='knockout-match';
    div.innerHTML=`<p><strong>FINAL:</strong> ${getTeamName(match.team1)} vs ${getTeamName(match.team2)}</p>
                   <p>Winner: ${buildSelect('Final', 0, match)}</p>`;
    FContainer.appendChild(div);
  }

  document.getElementById('championName').textContent=getTeamName(knockoutData.Champion);

  document.querySelectorAll('.winner-select').forEach(select => {
    select.addEventListener('change', (e) => {
      const stage = e.target.getAttribute('data-stage');
      const index = parseInt(e.target.getAttribute('data-index'));
      manualWinners[stage][index] = e.target.value; 
      updateKnockoutsFull(); 
      if(database && isAdmin) saveToFirebase(); 
    });
  });
}

function attachInputListeners(){
  document.querySelectorAll('.setsForInput, .setsAgainstInput').forEach(input=>{
    input.addEventListener('input',()=>{
      updateStandings();
      updateKnockoutsFull();
      if(database && isAdmin) saveToFirebase(); 
    });
  });
}

function saveToFirebase(){
  const data={};
  document.querySelectorAll('.team').forEach(team=>{
    const id=team.id;
    const forInputs=[...team.querySelectorAll('.setsForInput')].map(inp=>inp.value);
    const againstInputs=[...team.querySelectorAll('.setsAgainstInput')].map(inp=>inp.value);
    data[id] = { for: forInputs, against: againstInputs };
  });
  
  data.knockoutWinners = manualWinners;
  
  database.ref('smashBreathData').set(data);
}

function listenToFirebase(){
  database.ref('smashBreathData').on('value', (snapshot) => {
    const data = snapshot.val();
    if(!data) return; 

    try {
      if (data.knockoutWinners) {
         manualWinners = data.knockoutWinners;
      }

      Object.keys(data).forEach(id=>{
        if (id === 'knockoutWinners') return; 

        const team=document.getElementById(id);
        if(team && data[id].for && data[id].against){
          const forInputs=team.querySelectorAll('.setsForInput');
          const againstInputs=team.querySelectorAll('.setsAgainstInput');
          
          forInputs.forEach((inp,i)=>{ inp.value = data[id].for[i]; });
          againstInputs.forEach((inp,i)=>{ inp.value = data[id].against[i]; });
        }
      });
      
      updateStandings();
      updateKnockoutsFull();
    } catch(error) {
      console.log("Ignored old data format.", error);
    }
  });
}
</script>
</body>
</html>
